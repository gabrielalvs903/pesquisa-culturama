<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>culturama</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="culturama-favico.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
</head>
<body>

<main>
    <header>
        <img src="img/logo-culturama.png" alt="Logo do site culturama" >
        <h1>Pesquisa culturama</h1>
        
    </header>
    <section>

         <fieldset>
        
        <form action="" method="get"> 
        <fieldset> 

            <legend> INFORMAÇÕES DO USUÁRIO</legend>
            <label for="userName">NOME</label>
            <input type="text" id="userName" name="userName" required>
    
            <!-- Campo de idade media de usuários do site  -->
<br>      
         <label for="userAge">IDADE</label>
         <input type="number"   name="userAge" required min="12" max="100">

<br>
           <label for="birthDate">DATA DE NASCIMENTO</label>
           <input type="date" name="birthDate" required min="1900" max="2024">

<br>
            <label for="Email">EMAIL</label>
            <input type="email" id="Email" name="userEmail" required>

            <!-- campo de telefone do usuário -->
<br>
             <label for="Phone">TELEFONE</label>
             <input type="tel" id="Phone" name="userPhoneNumber" required pattern="[0-9]{11}" placeholder=" DDD + número mas sem espaço e sem hífen">

             <!-- campo para receber arquivos "imagens" do usuário -->
<br>
              <label for="Image">UPLOAD DE FOTOS</label>
              <input type="file" id="Image" accept="image/*" name="userImage">
       </fieldset> 
<br>           
    <fieldset>

    <legend>PERFIL</legend>

    <p>GÊNERO:</p>
    <input type="radio" id="feminino" name="userGender" value="feminino">
    <label for="feminino">Feminino</label>
    
    <input type="radio" id="masculino"name="userGender" value="masculino">
    <label for="masculino" >Masculino</label>

     <input type="radio" id="notiformd"name="userGender" value="notiformd">
    <label for="notiformd">Prefiro não informar</label>
    <br>
    
    <label for="maritalStatus">Estado Civil:</label>
    <select id="maritalStatus" name="maritalStatus">
        <option value="notinfomad">Selecione...</option>
        <option value="casado">Casado</option>
        <option value="solteiro">Solteiro</option>
        <option value="divorciado">Divorciado</option>
        <option value="União estavél ">União estável</option>
    </select> 
    </fieldset>
<br>
<fieldset>  
    <legend>SEU ESTADO:</legend>
    <label for="states" id="states">ESTADOS</label>
<select name="states" id="states" required>
<option value="notinfomad">Selecione...</option>
<option value="AC">AC,Acre</option>       
<option value="AL">AL,Alagoas</option>      
<option value="AP">AP,Amapá</option>      
<option value="AM">AM,Amazonas</option>      
<option value="BA">BA,Bahia</option>      
<option value="CE">CE,Ceará</option>      
<option value="DF">DF,Distrito Federal</option>       
<option value="ES">ES,Espirito Santo</option>      
<option value="GO">GO,Goiás</option>       
<option value="MA">MA,Maranhão</option>       
<option value="MS">MS,Mato GrossoDoSul</option>       
<option value="MT">MT,Mato Grosso</option>       
<option value="MG">MG,Minas Gerais</option>       
<option value="PA">PA,Pará</option>     
<option value="PB">PB,Paraíba</option>       
<option value="PR">PR,Paraná</option>       
<option value="PE">PE,Pernambuco</option>       
<option value="RJ">RJ,Rio De Janeiro</option>      
<option value="RS">RS,Rio Grande DoSul</option>       
<option value="RO">RO,Rondônia</option>       
<option value="RR">RR,Roraima</option>       
<option value="SC">SC,Santa Catarina</option>       
<option value="SP">SP,São Paulo</option>       
<option value="SE">SE,Sergipe</option>       
<option value="TO">TO,Tocantins</option>  
</select>     
</fieldset>
<br>
<fieldset>
    <legend>HÁBITOS</legend>
    <p> REDES SOCIAIS:</p>
    <input type="checkbox" id="instagram"name="userInstagram" value="instagram">
    <label for="instagram">Instagram</label>
    <br>
     <input type="checkbox" id="facebook"name="userFacebook" value="facebook">
    <label for="facebook">Facebook</label>
    <br>
     <input type="checkbox"id="twitter" name="userTwitter" value="twitter">
    <label for="twitter">Twitter</label> 
    <br>
     <input type="checkbox" id="linkedin"name="userLinkedIn" value="linkedin">
    <label for="linkedin">LinkedIn</label>
    <br>
    <label for="musicStyle" >Estilo Musical:</label>
    <input list="styletypes" type="text" id="musicStyle" name="UserMusicStyle">
    <datalist id="styletypes">
        <option value="Rock">
        <option value="Pop">
        <option value="Sertanejo">
        <option value="Funk">
        <option value="Pagode">
        <option value="Forró">
        <option value="MPB">
    </datalist>
            <br>
            <label for="FavoriteColors">COR FAVORITA:</label>
            <input type="color" id="FavoriteColors" name="UserFavoriteColors" >
</fieldset> 
<br>
<fieldset>
    <label for="comments" name="userComments" value="comments">AVALIAÇÃO:</label>
    <input type="radio" id="comments" name="userComments" value="muito_bom">

    <label for="comments">Muito bom</label>
    <input type="radio" id="commentsBom" name="userComments" value="bom">
    <label for="commentsBom">Bom</label>

    <input type="radio" id="commentsRegular" name="userComments" value="regular">
    <label for="commentsRegular">Regular</label>

    <input type="radio" id="commentsRuim" name="userComments" value="ruim">
    <label for="commentsRuim">Ruim</label>
    <br> 
       
    <label for="commentsText">ESCREVA SUA EXPERIÊNCIA:</label>
    <br>
    <textarea id="commentsText" name="userCommentsText"placeholder="Escreva aqui sua avaliação"></textarea>
</fieldset>
<br>
<fieldset>
    <legend>CONFIRMAÇÕES</legend>
    <input type="checkbox" id="confirmTerm" name="userLGPD" value="accepted" required>
    <label for="confirmTerm">Confirmo que li e concordo com os termos de uso</label>
    <br>
    <input type="checkbox" id="Getresult" name="UserGetresult" value="accepted">
    <label for="Getresult">Desejo receber os resultados da pesquisa por e-mail</label>
</fieldset>
<br>
<button type="submit">Enviar</button> <button type="reset">Limpar</button>
</form>

    </section>
</main>

</body>
</html>
