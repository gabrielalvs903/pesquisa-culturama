<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>culturama</title>
</head>
<body>

    <header>
        <h1>Pesquisa culturama</h1>
    </header>

    <section>
        <!-- Formulario de pesquisa "nome" do usuario"-->
        
        <form action="" method="get"> 
        <fieldset> 
            <legend> INFORMAÇÕES DO USUÁRIO</legend>
            <label for="userName">NOME</label>
            <input type="text" id="userName" name="userName" required>
        
           
         <label for="Age">IDADE</label>
         <input type="number"  id="Age" name="userAge" required min="12" max="100">
         
<br>
           <label for="Date">DATA DE NASCIMENTO</label>
           <input type="date" id="Date"name="birthDate" required min="1900" max="2024">

           
<br>
            <label for="Email">EMAIL</label>
            <input type="email" id="Email" name="userEmail" required>

            
<br>
             <label for="Phone">TELEFONE</label>
             <input type="tel" id="Phone" name="userPhoneNumber" required pattern="[0-9]{11}" placeholder=" DDD + número mas sem espaço e sem hífen">

            
<br>
              <label for="Image">Uploud de fotos</label>
              <input type="file" id="Image" accept="image/*" name="userImage">

<br>           

</fieldset>


    <fieldset>

    <legend>PERFIL</legend>

    <p>Gênero:</p>
    <input type="radio" name="userGender" value="feminino">
    <label for="feminine" id="feminine">Feminino</label>
    
    <input type="radio" name="userGender" value="masculino">
    <label for="masculine" id="masculine">Masculino</label>

     <input type="radio" name="notiformd" value="notiformd">
    <label for="notiformd" id="notiformd">Prefiro não informar</label>
    <br>
    
    <label for="maritalStatus">Estado Civil:</label>
    <select id="maritalStatus" name="maritalStatus">
        <option value="notinfomad">Selecione...</option>
        <option value="casado">Casado</option>
        <option value="solteiro">Solteiro</option>
        <option value="divorciado">Divorciado</option>
        <option value="União estavél ">União estável</option>
    </select> 
    </fieldset>
<br>
<fieldset>  
    <legend>Seu Estado:</legend>
    <label for="states" id="states">Estados</label>
<select name="states" id="states" required>
<option value="notinfomad">Selecione...</option>
<option value="AC">AC,Acre</option>       
<option value="AL">AL,Alagoas</option>      
<option value="AP">AP,Amapá</option>      
<option value="AM">AM,Amazonas</option>      
<option value="BA">BA,Bahia</option>      
<option value="CE">CE,Ceará</option>      
<option value="DF">DF,Distrito Federal</option>       
<option value="ES">ES,Espirito Santo</option>      
<option value="GO">GO,Goiás</option>       
<option value="MA">MA,Maranhão</option>       
<option value="MS">MS,Mato GrossoDoSul</option>       
<option value="MT">MT,Mato Grosso</option>       
<option value="MG">MG,Minas Gerais</option>       
<option value="PA">PA,Pará</option>     
<option value="PB">PB,Paraíba</option>       
<option value="PR">PR,Paraná</option>       
<option value="PE">PE,Pernambuco</option>       
<option value="RJ">RJ,Rio De Janeiro</option>      
<option value="RS">RS,Rio Grande DoSul</option>       
<option value="RO">RO,Rondônia</option>       
<option value="RR">RR,Roraima</option>       
<option value="SC">SC,Santa Catarina</option>       
<option value="SP">SP,São Paulo</option>       
<option value="SE">SE,Sergipe</option>       
<option value="TO">TO,Tocantins</option>  
</select>     
</fieldset>

<fieldset>
    <legend>Hábitos</legend>
    <p>Redes Sociais:</p>
    <input type="checkbox" name="Social" value="instagram">
    <label for="instagram"id="instagram">Instagram</label>
    <br>
     <input type="checkbox" name="Social" value="facebook">
    <label for="facebook"id="facebook">Facebook</label>
    <br>
     <input type="checkbox" name="Social" value="twitter">
    <label for="twitter"id="twitter">Twitter</label> 
    <br>
     <input type="checkbox" name="Social" value="linkedin">
    <label for="linkedin"id="linkedin">LinkedIn</label>
    <br>
    <label for="musicStyle" >Estilo Musical:</label>
    <input list="styletypes" type="text" id="musicStyle" name="UserMusicStyle">
    <datalist id="styletypes">
        <option value="Rock">
        <option value="Pop">
        <option value="Sertanejo">
        <option value="Funk">
        <option value="Pagode">
        <option value="Forró">
        <option value="MPB">
</fieldset>

<button type="submit">Enviar</button>
        </form>
       
    </section>
</body>
</html>
